<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#79c0ff;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1f6feb;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bg)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="800" height="1" fill="url(#accent)" opacity="0.5"/>

  <!-- Bottom accent line -->
  <rect x="0" y="199" width="800" height="1" fill="url(#accent)" opacity="0.5"/>

  <!-- Decorative grid dots -->
  <g fill="#58a6ff" opacity="0.08">
    <circle cx="50" cy="50" r="1"/>
    <circle cx="150" cy="50" r="1"/>
    <circle cx="250" cy="50" r="1"/>
    <circle cx="350" cy="50" r="1"/>
    <circle cx="450" cy="50" r="1"/>
    <circle cx="550" cy="50" r="1"/>
    <circle cx="650" cy="50" r="1"/>
    <circle cx="750" cy="50" r="1"/>
    <circle cx="50" cy="150" r="1"/>
    <circle cx="150" cy="150" r="1"/>
    <circle cx="250" cy="150" r="1"/>
    <circle cx="350" cy="150" r="1"/>
    <circle cx="450" cy="150" r="1"/>
    <circle cx="550" cy="150" r="1"/>
    <circle cx="650" cy="150" r="1"/>
    <circle cx="750" cy="150" r="1"/>
  </g>

  <!-- Glow bar behind text -->
  <rect x="295" y="60" width="210" height="2" fill="url(#accent2)" rx="1"/>

  <!-- Title -->
  <text x="400" y="95" font-family="monospace, 'Courier New', Courier" font-size="28" font-weight="bold" fill="#e6edf3" text-anchor="middle" letter-spacing="2">luxesses</text>

  <!-- Subtitle -->
  <text x="400" y="130" font-family="sans-serif, 'Segoe UI', Helvetica" font-size="14" fill="#8b949e" text-anchor="middle" letter-spacing="4">SYSTEMS &bull; INFRASTRUCTURE &bull; LOW-LEVEL</text>

  <!-- Bottom accent glow -->
  <rect x="360" y="148" width="80" height="1" fill="url(#accent)" opacity="0.3" rx="1"/>
  <!-- cache bust 2 -->
</svg>
